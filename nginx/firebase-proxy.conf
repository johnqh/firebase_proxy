# Firebase reverse proxy — nginx variant.
# Deploy on a VPS reachable from mainland China (HK / SG / Tokyo), or behind
# an ICP-filed domain + Chinese CDN for best reliability.
#
# Same path scheme as the Cloudflare Worker:
#   /identitytoolkit/ /securetoken/ /remoteconfig/ /installations/ /gtm/ /ga/

server {
    listen 443 ssl;
    http2 on;
    server_name fb-api.example.com;

    ssl_certificate     /etc/letsencrypt/live/fb-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fb-api.example.com/privkey.pem;

    # Re-resolve Google IPs periodically instead of caching them forever.
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Shared upstream settings.
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_set_header Cookie "";
    proxy_set_header Accept-Encoding "";

    # Auth (Identity Toolkit)
    location /identitytoolkit/ {
        proxy_set_header Host identitytoolkit.googleapis.com;
        proxy_ssl_name identitytoolkit.googleapis.com;
        proxy_pass https://identitytoolkit.googleapis.com/;
    }

    # Auth token refresh
    location /securetoken/ {
        proxy_set_header Host securetoken.googleapis.com;
        proxy_ssl_name securetoken.googleapis.com;
        proxy_pass https://securetoken.googleapis.com/;
    }

    # Remote Config
    location /remoteconfig/ {
        proxy_set_header Host firebaseremoteconfig.googleapis.com;
        proxy_ssl_name firebaseremoteconfig.googleapis.com;
        proxy_pass https://firebaseremoteconfig.googleapis.com/;
    }

    # Firebase Installations (required by Remote Config + Analytics)
    location /installations/ {
        proxy_set_header Host firebaseinstallations.googleapis.com;
        proxy_ssl_name firebaseinstallations.googleapis.com;
        proxy_pass https://firebaseinstallations.googleapis.com/;
    }

    # gtag.js script
    location /gtm/ {
        proxy_set_header Host www.googletagmanager.com;
        proxy_ssl_name www.googletagmanager.com;
        proxy_pass https://www.googletagmanager.com/;
    }

    # Analytics collect endpoint
    location /ga/ {
        proxy_set_header Host region1.google-analytics.com;
        proxy_ssl_name region1.google-analytics.com;
        proxy_pass https://region1.google-analytics.com/;
    }

    location / {
        return 404;
    }
}
